[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "france-crisis-intelligence"
version = "1.0.1"
description = "Evidence-first monitoring and analysis of France's economic and social indicators"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26,<3", "requests>=2.31,<3", "PyYAML>=6.0,<7",
  "plotly>=5.18,<7", "streamlit>=1.32,<2", "scikit-learn>=1.4,<2",
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "duckdb>=1.1,<2", "reportlab>=4,<5", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[project.scripts]
france-crisis = "france_crisis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
